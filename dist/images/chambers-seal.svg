<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#937233"/>
    </linearGradient>
    <path id="textCircle" d="M 100, 100 m -74, 0 a 74,74 0 1,1 148,0 a 74,74 0 1,1 -148,0" fill="none"/>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="88" fill="#0C1829" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3"/>
  
  <!-- Text Ring -->
  <text font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="8.8" font-weight="600" fill="#E5C77A" letter-spacing="2.2">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      ELENA V. MORETTI • ADVOCATE &amp; COUNSEL
    </textPath>
  </text>
  
  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="58" fill="#0F1F35" stroke="url(#goldGrad)" stroke-width="1.8"/>
  <circle cx="100" cy="100" r="54" fill="none" stroke="rgba(197, 160, 89, 0.4)" stroke-width="0.75"/>
  
  <!-- Laurel / Olive Branch Accents -->
  <g stroke="url(#goldGrad)" fill="none" stroke-width="1.2" opacity="0.85">
    <path d="M 68 126 C 65 110, 66 90, 78 78"/>
    <path d="M 132 126 C 135 110, 134 90, 122 78"/>
    <!-- Leaves -->
    <path d="M 66 112 C 61 108, 62 103, 67 106"/>
    <path d="M 69 98 C 65 94, 67 89, 72 92"/>
    <path d="M 134 112 C 139 108, 138 103, 133 106"/>
    <path d="M 131 98 C 135 94, 133 89, 128 92"/>
  </g>
  
  <!-- Center Monogram -->
  <text x="100" y="106" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">EVM</text>
  
  <!-- Year / Motto -->
  <text x="100" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="5.5" font-weight="600" fill="#E5C77A" text-anchor="middle" letter-spacing="1.8">EST. 2012</text>
  
  <!-- Decorative Stars -->
  <polygon points="100,64 102,68 106,68 103,71 104,75 100,72 96,75 97,71 94,68 98,68" fill="url(#goldGrad)"/>
</svg>
