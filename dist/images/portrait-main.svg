<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1626"/>
      <stop offset="50%" stop-color="#102035"/>
      <stop offset="100%" stop-color="#080F1A"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A283D"/>
      <stop offset="50%" stop-color="#121D2D"/>
      <stop offset="100%" stop-color="#0B131E"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FCECE2"/>
      <stop offset="60%" stop-color="#EED5C4"/>
      <stop offset="100%" stop-color="#D7B59F"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1D16"/>
      <stop offset="50%" stop-color="#1B120E"/>
      <stop offset="100%" stop-color="#0F0A08"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="100%" stop-color="#9E7728"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(197, 160, 89, 0.15)"/>
      <stop offset="100%" stop-color="rgba(11, 22, 38, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#bgGrad)"/>
  <rect width="600" height="750" fill="url(#glow)"/>

  <!-- Subtle Architectural Pillars in Background -->
  <g opacity="0.12" stroke="#C5A059" stroke-width="1.5">
    <line x1="80" y1="0" x2="80" y2="750"/>
    <line x1="120" y1="0" x2="120" y2="750"/>
    <line x1="480" y1="0" x2="480" y2="750"/>
    <line x1="520" y1="0" x2="520" y2="750"/>
    <path d="M 50 180 Q 300 120 550 180" fill="none"/>
  </g>

  <!-- Halo / Ambient rim light behind head -->
  <circle cx="300" cy="270" r="160" fill="rgba(197, 160, 89, 0.08)"/>

  <!-- Lawyer Figure -->
  <g id="figure">
    <!-- Dark Counsel Robe / Tailored Jacket -->
    <!-- Shoulders & Torso -->
    <path d="M 120 750 L 150 510 C 170 420 220 380 250 375 L 350 375 C 380 380 430 420 450 510 L 480 750 Z" fill="url(#suitGrad)"/>
    
    <!-- Lapels -->
    <path d="M 240 380 L 290 530 L 220 540 L 180 440 Z" fill="#0C1420" stroke="rgba(197, 160, 89, 0.2)" stroke-width="1"/>
    <path d="M 360 380 L 310 530 L 380 540 L 420 440 Z" fill="#0C1420" stroke="rgba(197, 160, 89, 0.2)" stroke-width="1"/>
    
    <!-- Pure Ivory Legal Collar / Tabs -->
    <path d="M 268 375 L 300 440 L 332 375 Z" fill="#FAF8F5"/>
    <!-- Advocate White Bands / Tabs -->
    <g fill="#F7F5F0" stroke="#E2E8F0" stroke-width="0.8">
      <rect x="288" y="405" width="10" height="75" rx="1.5"/>
      <rect x="302" y="405" width="10" height="75" rx="1.5"/>
    </g>

    <!-- Gold Chambers Lapel Pin -->
    <circle cx="218" cy="455" r="5" fill="url(#goldAccent)"/>
    <circle cx="218" cy="455" r="3" fill="#0F1C2E"/>

    <!-- Neck & Throat -->
    <path d="M 265 310 C 265 350 270 380 300 380 C 330 380 335 350 335 310 Z" fill="url(#skinGrad)"/>
    <path d="M 270 340 C 285 365 315 365 330 340 Z" fill="rgba(168, 120, 95, 0.2)"/>

    <!-- Head / Face Silhouette -->
    <!-- Chin & Jawline -->
    <path d="M 240 240 C 240 310 265 340 300 340 C 335 340 360 310 360 240 C 360 170 340 150 300 150 C 260 150 240 170 240 240 Z" fill="url(#skinGrad)"/>
    
    <!-- Hair (Elegant professional updo / swept-back dark waves) -->
    <path d="M 230 220 C 225 150 255 110 300 110 C 345 110 375 150 370 220 C 365 240 360 260 365 280 C 358 275 358 250 355 230 C 350 175 335 140 300 140 C 265 140 250 175 245 230 C 242 250 242 275 235 280 C 240 260 235 240 230 220 Z" fill="url(#hairGrad)"/>
    
    <!-- Eyes & Brows (Refined, intelligent, focused expression) -->
    <!-- Eyebrows -->
    <path d="M 262 215 Q 275 210 286 215" stroke="#2D1D16" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 314 215 Q 325 210 338 215" stroke="#2D1D16" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <ellipse cx="275" cy="226" rx="8" ry="4.5" fill="#FFFFFF"/>
    <circle cx="276" cy="226" r="3.2" fill="#241B15"/>
    <circle cx="277.2" cy="225" r="1.2" fill="#FFFFFF"/>
    <path d="M 267 225 Q 275 221 283 225" stroke="#1F150F" stroke-width="1.8" fill="none"/>

    <ellipse cx="325" cy="226" rx="8" ry="4.5" fill="#FFFFFF"/>
    <circle cx="324" cy="226" r="3.2" fill="#241B15"/>
    <circle cx="325.2" cy="225" r="1.2" fill="#FFFFFF"/>
    <path d="M 317 225 Q 325 221 333 225" stroke="#1F150F" stroke-width="1.8" fill="none"/>

    <!-- Nose Bridge -->
    <path d="M 300 220 L 298 255 L 304 257" stroke="#BA8E74" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Lips (Composed, confident, warm neutral) -->
    <path d="M 286 282 Q 300 279 314 282 Q 300 292 286 282 Z" fill="#B3655D"/>
    <path d="M 288 282 Q 300 284 312 282" stroke="#873F38" stroke-width="1" fill="none"/>

    <!-- Subtle spectacles / glasses (Refined wireframe gold) -->
    <rect x="264" y="218" width="24" height="17" rx="3.5" fill="none" stroke="url(#goldAccent)" stroke-width="1.2"/>
    <rect x="312" y="218" width="24" height="17" rx="3.5" fill="none" stroke="url(#goldAccent)" stroke-width="1.2"/>
    <line x1="288" y1="223" x2="312" y2="223" stroke="url(#goldAccent)" stroke-width="1.2"/>
    <line x1="264" y1="223" x2="250" y2="220" stroke="url(#goldAccent)" stroke-width="1"/>
    <line x1="336" y1="223" x2="350" y2="220" stroke="url(#goldAccent)" stroke-width="1"/>

    <!-- Subtle Shading for depth -->
    <path d="M 242 250 C 240 300 260 330 300 335 C 275 325 255 295 252 255 Z" fill="rgba(145, 95, 75, 0.15)"/>
  </g>

  <!-- Elegant Inner Border Frame with Gold Filigree -->
  <rect x="20" y="20" width="560" height="710" fill="none" stroke="url(#goldAccent)" stroke-width="1" opacity="0.6"/>
  <rect x="28" y="28" width="544" height="694" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="0.8"/>

  <!-- Signature / Watermark in Bottom Corner -->
  <text x="45" y="705" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-style="italic" fill="#E5C77A" opacity="0.8" letter-spacing="1">Elena V. Moretti, LL.M. — High Court &amp; Supreme Court Practice</text>
  <text x="545" y="705" font-family="'Cinzel', Georgia, serif" font-size="10" font-weight="700" fill="#E5C77A" opacity="0.8" text-anchor="end">EST. 2012</text>
</svg>
