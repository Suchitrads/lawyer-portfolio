  <!-- Leaf 2 -->
  <path d="M 60 90 Q 80 85 76 72 Q 62 76 60 90 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <path d="M 55 95 Q 40 90 42 78 Q 54 84 55 95 Z" fill="#F1F1F1" stroke="#111111" stroke-width="1.5"/>

  <!-- Leaf 3 -->
  <path d="M 78 65 Q 100 58 96 46 Q 80 50 78 65 Z" fill="#F1F1F1" stroke="#111111" stroke-width="1.5"/>
  <path d="M 72 70 Q 56 64 60 52 Q 72 58 72 70 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>

  <!-- Tip Leaf -->
