  <!-- Pairs of Leaves -->
  <!-- Leaf 1 -->
  <path d="M 45 115 Q 60 110 58 98 Q 45 102 45 115 Z" fill="#F1F1F1" stroke="#111111" stroke-width="1.5"/>
