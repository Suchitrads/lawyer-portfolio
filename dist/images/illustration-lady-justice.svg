<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Classical Lady Justice Engraving Silhouette in Grayscale -->
  <defs>
    <linearGradient id="shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- Blindfold & Head -->
  <circle cx="100" cy="45" r="18" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <!-- Classical Chignon / Hair -->
  <path d="M 85 40 C 85 24, 115 24, 115 40 C 118 32, 108 26, 100 26 C 92 26, 82 32, 85 40 Z" fill="#111111"/>
  <!-- Blindfold Band -->
  <rect x="83" y="42" width="34" height="7" rx="1.5" fill="#111111"/>
  <line x1="83" y1="45" x2="76" y2="52"/>

  <!-- Neck & Graceful Shoulders -->
  <path d="M 94 63 L 94 72 L 68 85 L 132 85 L 106 72 L 106 63" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>

  <!-- Flowing Classical Robes / Toga -->
  <path d="M 68 85 Q 55 140 60 215 L 140 215 Q 145 140 132 85 Z" fill="#FAFAFA" stroke="#111111" stroke-width="2"/>
  
  <!-- Folds of Drapery -->
  <path d="M 78 88 Q 72 150 76 215" stroke="#777777" stroke-width="1.2"/>
  <path d="M 90 85 Q 86 160 88 215" stroke="#777777" stroke-width="1.2"/>
  <path d="M 100 85 Q 100 160 100 215" stroke="#111111" stroke-width="1.5"/>
  <path d="M 110 85 Q 114 160 112 215" stroke="#777777" stroke-width="1.2"/>
  <path d="M 122 88 Q 128 150 124 215" stroke="#777777" stroke-width="1.2"/>
  <!-- Sash across chest -->
  <path d="M 72 90 Q 100 120 130 115" stroke="#111111" stroke-width="2" fill="none"/>

  <!-- Left Arm Holding Scales of Justice -->
  <path d="M 68 85 L 42 105 L 35 102" stroke="#111111" stroke-width="2"/>
  <!-- Hand -->
  <circle cx="34" cy="102" r="3" fill="#111111"/>
  <!-- Scale Crossbeam -->
  <line x1="12" y1="104" x2="56" y2="100" stroke="#111111" stroke-width="2"/>
  <circle cx="34" cy="102" r="1.5" fill="#FFFFFF"/>
  <!-- Left Pan -->
  <line x1="14" y1="104" x2="8" y2="128" stroke="#777777" stroke-width="1"/>
  <line x1="14" y1="104" x2="20" y2="128" stroke="#777777" stroke-width="1"/>
  <path d="M 6 128 Q 14 135 22 128 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <!-- Right Pan -->
  <line x1="54" y1="100" x2="48" y2="124" stroke="#777777" stroke-width="1"/>
  <line x1="54" y1="100" x2="60" y2="124" stroke="#777777" stroke-width="1"/>
  <path d="M 46 124 Q 54 131 62 124 Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>

  <!-- Right Arm Holding Upright Sword of Justice -->
  <path d="M 132 85 L 155 105 L 160 102" stroke="#111111" stroke-width="2"/>
  <circle cx="160" cy="102" r="3" fill="#111111"/>
  <!-- Sword -->
  <!-- Pommel & Hilt -->
  <circle cx="160" cy="115" r="2.5" fill="#111111"/>
  <line x1="150" y1="108" x2="170" y2="108" stroke="#111111" stroke-width="2.5"/>
  <!-- Blade pointing upwards -->
  <path d="M 158 108 L 158 20 L 160 12 L 162 20 L 162 108 Z" fill="#FAFAFA" stroke="#111111" stroke-width="1.5"/>
  <line x1="160" y1="12" x2="160" y2="108" stroke="#777777" stroke-width="1"/>

  <!-- Pedestal / Base -->
  <rect x="45" y="215" width="110" height="12" rx="1" fill="#FAFAFA" stroke="#111111" stroke-width="2"/>
  <rect x="35" y="227" width="130" height="7" rx="1" fill="#111111"/>
</svg>
