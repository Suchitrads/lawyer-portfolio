<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Stack of Classical Legal Treatises in Editorial Grayscale -->
  <!-- Bottom Book -->
  <path d="M 20 95 L 140 95 L 135 110 L 15 110 Z" fill="#F1F1F1" stroke="#111111" stroke-width="2"/>
  <rect x="15" y="95" width="8" height="15" fill="#111111"/>
  <!-- Pages texture -->
  <line x1="28" y1="102" x2="132" y2="102" stroke="#777777" stroke-width="0.8"/>
  <line x1="28" y1="106" x2="132" y2="106" stroke="#777777" stroke-width="0.8"/>

  <!-- Middle Book (Slightly Angled) -->
  <path d="M 25 75 L 135 72 L 132 88 L 22 91 Z" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <path d="M 22 91 L 25 75 L 30 75 L 27 91 Z" fill="#111111"/>
  <line x1="35" y1="81" x2="128" y2="78" stroke="#777777" stroke-width="0.8"/>
  <line x1="35" y1="85" x2="128" y2="82" stroke="#777777" stroke-width="0.8"/>

  <!-- Top Open Book -->
  <path d="M 80 50 C 65 42, 45 42, 30 46 L 30 68 C 45 64, 65 64, 80 72 C 95 64, 115 64, 130 68 L 130 46 C 115 42, 95 42, 80 50 Z" fill="#FAFAFA" stroke="#111111" stroke-width="2"/>
  <line x1="80" y1="50" x2="80" y2="72" stroke="#111111" stroke-width="2"/>
  
  <!-- Ribbon Bookmark hanging down -->
  <path d="M 80 50 L 86 85 L 80 80 L 74 85 Z" fill="#111111"/>

  <!-- Text lines on open pages -->
  <line x1="40" y1="52" x2="70" y2="50" stroke="#777777" stroke-width="1"/>
  <line x1="40" y1="57" x2="68" y2="55" stroke="#777777" stroke-width="1"/>
  <line x1="40" y1="62" x2="70" y2="60" stroke="#777777" stroke-width="1"/>

  <line x1="90" y1="50" x2="120" y2="52" stroke="#777777" stroke-width="1"/>
  <line x1="92" y1="55" x2="120" y2="57" stroke="#777777" stroke-width="1"/>
  <line x1="90" y1="60" x2="118" y2="62" stroke="#777777" stroke-width="1"/>
</svg>
