<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="550" height="400">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B2C"/>
      <stop offset="100%" stop-color="#080E17"/>
    </linearGradient>
    <linearGradient id="goldMuted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8F6B27"/>
    </linearGradient>
  </defs>

  <rect width="550" height="400" fill="url(#libBg)"/>

  <!-- Law Library Bookshelves in Background -->
  <g opacity="0.35">
    <!-- Shelf 1 -->
    <rect x="30" y="40" width="490" height="8" fill="#1C2E47"/>
    <!-- Books -->
    <rect x="40" y="48" width="16" height="75" fill="#4A1E1E"/>
    <rect x="58" y="48" width="14" height="75" fill="#1C382A"/>
    <rect x="74" y="48" width="20" height="75" fill="#1D2A44"/>
    <rect x="96" y="48" width="18" height="75" fill="#5C421E"/>
    <rect x="116" y="48" width="14" height="75" fill="#3A1C2E"/>
    <rect x="132" y="48" width="22" height="75" fill="#1D2A44"/>
    <rect x="156" y="48" width="16" height="75" fill="#4A1E1E"/>
    <!-- Gold spines -->
    <line x1="48" y1="55" x2="48" y2="115" stroke="#C5A059" stroke-width="0.8"/>
    <line x1="84" y1="55" x2="84" y2="115" stroke="#C5A059" stroke-width="0.8"/>
    <line x1="143" y1="55" x2="143" y2="115" stroke="#C5A059" stroke-width="0.8"/>

    <!-- Shelf 2 -->
    <rect x="30" y="125" width="490" height="8" fill="#1C2E47"/>
    <rect x="40" y="133" width="18" height="85" fill="#1C382A"/>
    <rect x="60" y="133" width="22" height="85" fill="#1D2A44"/>
    <rect x="84" y="133" width="16" height="85" fill="#4A1E1E"/>
    <rect x="102" y="133" width="20" height="85" fill="#5C421E"/>
  </g>

  <!-- Wooden Conference Desk & Legal Briefs -->
  <polygon points="0,310 550,280 550,400 0,400" fill="#0C1523"/>
  <polygon points="0,310 550,280 550,285 0,315" fill="#1C2F4B"/>
  
  <!-- Legal Brief Folders & Case Files on Desk -->
  <polygon points="60,330 180,315 220,360 90,378" fill="#F4EFEA" stroke="#D1C4B0" stroke-width="1"/>
  <polygon points="75,325 195,310 230,352 105,370" fill="#FCFAF7" stroke="#D1C4B0" stroke-width="1"/>
  <!-- Red Legal Ribbon (Pink Tape) -->
  <path d="M 120 320 Q 150 340 170 365" stroke="#C53030" stroke-width="3" fill="none"/>
  
  <!-- Modern Brass Desk Lamp Glow -->
  <circle cx="470" cy="180" r="120" fill="rgba(229, 199, 122, 0.08)"/>
  <path d="M 470 120 C 470 160 450 200 480 290" stroke="url(#goldMuted)" stroke-width="3.5" fill="none"/>
  <path d="M 440 120 Q 470 100 500 120 Z" fill="url(#goldMuted)"/>

  <!-- Lawyer Silhouette in Consultation / Reviewing Dossier -->
  <g transform="translate(260, 160)">
    <!-- Suit -->
    <path d="M 0 240 L 20 100 C 35 70 65 50 100 45 C 135 50 165 70 180 100 L 200 240 Z" fill="#121F33"/>
    <path d="M 80 45 L 100 105 L 120 45 Z" fill="#FAF8F5"/>
    <!-- Head -->
    <circle cx="100" cy="15" r="28" fill="#EED5C4"/>
    <path d="M 72 10 C 70 -20 100 -25 125 -10 C 130 10 125 35 120 40 C 115 15 110 -5 100 -5 C 88 -5 80 10 72 10 Z" fill="#1B120E"/>
    <!-- Hands holding fountain pen and parchment -->
    <circle cx="70" cy="170" r="10" fill="#EED5C4"/>
    <circle cx="125" cy="165" r="10" fill="#EED5C4"/>
    <line x1="125" y1="165" x2="105" y2="185" stroke="url(#goldMuted)" stroke-width="2.5"/>
  </g>

  <!-- Elegant Inner Border -->
  <rect x="15" y="15" width="520" height="370" fill="none" stroke="rgba(197, 160, 89, 0.4)" stroke-width="1"/>
  
  <!-- Subtle Badge -->
  <rect x="30" y="30" width="165" height="28" rx="4" fill="#0B1524" stroke="rgba(197, 160, 89, 0.3)" stroke-width="0.8"/>
  <text x="42" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#E5C77A" letter-spacing="1">CHAMBERS ARCHIVE &amp; STUDY</text>
</svg>
