<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="300" height="350" fill="none" stroke="#777777" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
  <!-- Classical Neoclassical High Court Ionic Columns & Pediment -->
  <!-- Triangular Pediment -->
  <polygon points="150,20 20,80 280,80" fill="#FAFAFA" stroke="#111111" stroke-width="2"/>
  <polygon points="150,30 35,80 265,80" fill="none" stroke="#777777" stroke-width="0.8"/>
  <circle cx="150" cy="55" r="14" fill="#F1F1F1" stroke="#111111" stroke-width="1.2"/>

  <!-- Entablature / Architrave -->
  <rect x="20" y="80" width="260" height="14" fill="#FFFFFF" stroke="#111111" stroke-width="1.8"/>
  <rect x="25" y="94" width="250" height="8" fill="#F1F1F1" stroke="#111111" stroke-width="1.5"/>

  <!-- 4 Classical Fluted Columns -->
  <!-- Column 1 -->
  <g transform="translate(35, 102)">
    <!-- Capital -->
    <rect x="-4" y="0" width="28" height="6" fill="#111111"/>
    <circle cx="0" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <circle cx="20" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <!-- Shaft -->
    <rect x="0" y="10" width="20" height="180" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="5" y2="190" stroke="#E5E5E5"/>
    <line x1="10" y1="10" x2="10" y2="190" stroke="#777777" stroke-width="0.8"/>
    <line x1="15" y1="10" x2="15" y2="190" stroke="#E5E5E5"/>
    <!-- Base -->
    <rect x="-4" y="190" width="28" height="8" fill="#111111"/>
  </g>

  <!-- Column 2 -->
  <g transform="translate(105, 102)">
    <rect x="-4" y="0" width="28" height="6" fill="#111111"/>
    <circle cx="0" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <circle cx="20" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="0" y="10" width="20" height="180" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="5" y2="190" stroke="#E5E5E5"/>
    <line x1="10" y1="10" x2="10" y2="190" stroke="#777777" stroke-width="0.8"/>
    <line x1="15" y1="10" x2="15" y2="190" stroke="#E5E5E5"/>
    <rect x="-4" y="190" width="28" height="8" fill="#111111"/>
  </g>

  <!-- Column 3 -->
  <g transform="translate(175, 102)">
    <rect x="-4" y="0" width="28" height="6" fill="#111111"/>
    <circle cx="0" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <circle cx="20" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="0" y="10" width="20" height="180" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="5" y2="190" stroke="#E5E5E5"/>
    <line x1="10" y1="10" x2="10" y2="190" stroke="#777777" stroke-width="0.8"/>
    <line x1="15" y1="10" x2="15" y2="190" stroke="#E5E5E5"/>
    <rect x="-4" y="190" width="28" height="8" fill="#111111"/>
  </g>

  <!-- Column 4 -->
  <g transform="translate(245, 102)">
    <rect x="-4" y="0" width="28" height="6" fill="#111111"/>
    <circle cx="0" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <circle cx="20" cy="6" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <rect x="0" y="10" width="20" height="180" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="5" y2="190" stroke="#E5E5E5"/>
    <line x1="10" y1="10" x2="10" y2="190" stroke="#777777" stroke-width="0.8"/>
    <line x1="15" y1="10" x2="15" y2="190" stroke="#E5E5E5"/>
    <rect x="-4" y="190" width="28" height="8" fill="#111111"/>
  </g>

  <!-- Stylobate Steps / Base -->
  <rect x="15" y="300" width="270" height="12" fill="#F1F1F1" stroke="#111111" stroke-width="1.8"/>
  <rect x="5" y="312" width="290" height="14" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
</svg>
